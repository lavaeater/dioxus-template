[package]
name = "{{project-name}}"
version = "0.1.0"
authors = ["{{authors}}"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { {{ dioxus_dep_src }}, features = {{dioxus_dep_features}} }

[features]
default = ["{{default_platform}}"]
{%- for feature in features %}
{{ feature }}
{%- endfor %}

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Dioxus components take their props by value.
needless_pass_by_value = "allow"
# Server functions must be async even when they never await.
unused_async = "allow"
similar_names = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Cheap guards against leftovers.
todo = "warn"
dbg_macro = "warn"

# Dev builds are tuned for compile speed, not runtime speed. Every tool (dx, bacon,
# cargo, rust-analyzer, agents) reads these, so builds stay interchangeable: never
# override profile settings, codegen backend or RUSTFLAGS through env vars.
[profile.dev]
# Enough for backtraces with line numbers; far less to write and link than full debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.wasm-dev]
inherits = "dev"

# Unoptimised dependency wasm is huge and sluggish in the browser; optimise only the
# dependencies so our own crates keep fast incremental rebuilds.
[profile.wasm-dev.package."*"]
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
